# =====================================================================
# docker-build — keep :latest always current with the official
# deepseek-ai/deepseek-harness releases.
#
# * schedule     : every 6h resolve the newest release on the chosen
#                  channel; if a build for that version (+this repo
#                  commit) is not already on GHCR, build and push.
# * manual       : run from the Actions tab anytime (force_build to skip
#                  the already-built check).
# * registry     : ghcr.io/<owner>/<repo> — uses only the built-in
#                  GITHUB_TOKEN, no secrets required.
# * tags pushed  : latest, dsh-<version>, build-<version>-<sha8>
# * platforms    : linux/amd64 (default) — arm64 opt-in via workflow input
#                  or repo variable vars.DSH_PLATFORMS (source builds for
#                  arm64 run under slow QEMU emulation, avoid on free runners)
#
# CHANNELS
#   npm (default) : @deepseek-ai/dsh dist-tags.latest — the OFFICIAL
#                   release channel (`npx @deepseek-ai/dsh web`); also
#                   what runzhliu & smanx package. Fast, slim, pinned.
#                   NOTE: GitHub-only pre-releases/alphas that were never
#                   published to npm cannot be installed this way.
#   github-tag    : newest `dsh-v*` tag on the official GitHub repo —
#                   INCLUDES pre-releases/alphas. Builds the upstream
#                   monorepo from source (slow, much larger image).
#                   Use for bleeding-edge tags like dsh-v0.1.2-alpha.1.
#
# Channel selection: workflow input (manual runs) > repository variable
# `vars.DSH_CHANNEL` (also applies to the cron) > default "npm".
# =====================================================================
name: docker-build

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "@deepseek-ai/dsh version to build (default: latest on npm)"
        required: false
        default: "latest"
      channel:
        description: "Release channel (overrides vars.DSH_CHANNEL)"
        type: choice
        default: ""
        options:
          - ""
          - npm
          - github-tag
      force_build:
        description: "Skip the already-built check and rebuild"
        type: boolean
        default: false
      platforms:
        description: "Target platforms (comma-separated). Default linux/amd64. arm64 needs QEMU and makes source builds 5-15x slower"
        required: false
        default: "linux/amd64"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Resolve upstream + decide build
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.upstream.outputs.version }}
      source_ref: ${{ steps.upstream.outputs.source_ref }}
      channel: ${{ steps.upstream.outputs.channel }}
      should_build: ${{ steps.decide.outputs.should_build }}
      build_key: ${{ steps.decide.outputs.build_key }}
    steps:
      - name: Resolve channel + latest upstream DSH version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # channel precedence: workflow input > repo variable vars.DSH_CHANNEL > npm
          CH="${{ github.event.inputs.channel || vars.DSH_CHANNEL || 'npm' }}"
          case "$CH" in npm|github-tag) ;; *) echo "Unknown channel '$CH'"; exit 1;; esac
          echo "channel=${CH}" >> "$GITHUB_OUTPUT"

          if [ "$CH" = "github-tag" ]; then
            # newest dsh-v* tag from the official repo (includes pre-releases)
            TAG="$(curl -fsSL 'https://api.github.com/repos/deepseek-ai/deepseek-harness/tags?per_page=100' \
              | python3 -c "import json,sys;tags=json.load(sys.stdin);print(next(t['name'] for t in tags if t['name'].startswith('dsh-v')))")"
            VER="${TAG#dsh-v}"
            echo "source_ref=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Upstream source tag: ${TAG} (version ${VER})"
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
               [ "${{ github.event.inputs.dsh_version }}" != "latest" ] && \
               [ -n "${{ github.event.inputs.dsh_version }}" ]; then
              VER="${{ github.event.inputs.dsh_version }}"
            else
              VER="$(curl -fsSL 'https://registry.npmjs.org/@deepseek-ai%2Fdsh' \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['dist-tags']['latest'])")"
            fi
            echo "source_ref=" >> "$GITHUB_OUTPUT"
            echo "Upstream @deepseek-ai/dsh version: ${VER} (npm)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: decide
        env:
          VER: ${{ steps.upstream.outputs.version }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          SHA8="$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)"
          KEY="build-${VER}-${SHA8}"
          echo "build_key=${KEY}" >> "$GITHUB_OUTPUT"
          if [ "${FORCE}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "force_build requested -> building"
            exit 0
          fi
          if docker manifest inspect "${IMAGE}:${KEY}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Image for dsh ${VER} + commit ${SHA8} already on GHCR -> skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No image for dsh ${VER} + commit ${SHA8} -> building"
          fi

  build:
    name: Build & push (${{ github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64' }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (only needed for arm64)
        if: contains((github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64'), 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64' }}
          push: true
          build-args: |
            DSH_VERSION=${{ needs.check.outputs.dsh_version }}
            DSH_SOURCE_REF=${{ needs.check.outputs.source_ref }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:dsh-${{ needs.check.outputs.dsh_version }}
            ${{ env.IMAGE }}:${{ needs.check.outputs.build_key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## seek-harness image updated"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Channel | \`${{ needs.check.outputs.channel }}\` |"
            echo "| Upstream version | \`${{ needs.check.outputs.dsh_version }}\` |"
            echo "| Image | \`${{ env.IMAGE }}:latest\` |"
            echo "| Version tag | \`:dsh-${{ needs.check.outputs.dsh_version }}\` |"
            echo "| Build tag | \`${{ needs.check.outputs.build_key }}\` |"
            echo "| Platforms | \`${{ github.event.inputs.platforms || vars.DSH_PLATFORMS || 'linux/amd64' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
