# =====================================================================
# seek-harness — hardened deployment (runzhliu-style hardening)
#
#   cp .env.example .env   (then edit)
#   docker compose pull
#   DSH_WORKSPACE=/abs/path/to/project docker compose up -d
#
# Security model (base compose keeps everything locked down):
#   * DSH listens on 127.0.0.1 INSIDE the container (upstream refuses
#     0.0.0.0 by design); the built-in reverse proxy is the only public
#     surface (the "0.0.0.0 fix").
#   * Publishes to 127.0.0.1 by default. For LAN access set DSH_BIND=0.0.0.0 —
#     the proxy auto-mints browser sessions from dsh web's boot token
#     (zero-auth LAN). Set PROXY_USERNAME+PROXY_PASSWORD to require Basic
#     Auth if other LAN devices should stay out.
#   * cap_drop ALL / no-new-privileges / read-only rootfs / tmpfs /tmp.
#   * Only the workspace bind is writable. Never mount ~, .ssh, cloud
#     credentials, or docker.sock into the BASE compose file — use the
#     compose.docker.yaml override for docker access.
# =====================================================================

services:
  seek-harness:
    image: ghcr.io/yakuza8702/docker-deepseek-harness:latest
    container_name: seek-harness
    restart: unless-stopped
    ports:
      # DSH_BIND=127.0.0.1 (default, local only) or 0.0.0.0 (LAN, needs auth)
      - "${DSH_BIND:-127.0.0.1}:${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      # 0.0.0.0 fix: DSH loopback port + public proxy port (must differ)
      DSH_PORT: "${DSH_PORT:-3079}"
      PROXY_PORT: "${PROXY_PORT:-3080}"
      PROXY_HOST: "0.0.0.0"
      # Optional Basic Auth on HTTP + WebSocket (enabled only when BOTH set)
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
      # Extra authorities for DSH's /api browser-trust fence (comma list).
      # OPTIONAL/legacy — the proxy now translates same-origin markers itself;
      # only useful if you expose DSH's port without its proxy.
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
      # Docker engine access — either TCP proxy…
      DOCKER_HOST: "${DOCKER_HOST:-}"
      # …or mount /var/run/docker.sock via the compose.docker.yaml override
      # FIX 2026-09-01: proxy "unlock remote settings" JS rewrite regex only
      # matched the LAST dotted segment; on newer upstream code it corrupted
      # the served bundle (ctx.remote.$host.isLoopback ? ... -> ctx.remote."host"
      # = SyntaxError). Patched proxy + settings shim are bind-mounted below.
      # PROXY_UNLOCK_REMOTE_SETTINGS=1 keeps the (now-safe) rewrite feature on;
      # set to 0 to disable the feature entirely (stock behaviour).
      PROXY_UNLOCK_REMOTE_SETTINGS: "${PROXY_UNLOCK_REMOTE_SETTINGS:-1}"
      # upstream runtime knobs (safe defaults; see README)
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-1}"
      DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE:-}"
      DSH_TOOLS_MODE: "${DSH_TOOLS_MODE:-}"
    env_file:
      - path: .env
        required: false
    volumes:
      # DSH state: profiles / settings / credentials / sessions / storage
      - dsh-home:/home/node/.dsh
      # Agent workspace (the Web UI dir-selector treats /workspace as HOME)
      - ${DSH_WORKSPACE:-./workspace}:/workspace
      # FIX 2026-09-01: patched reverse proxy (full dotted-chain regex fix)
      # overrides the read-only image copy at /opt/seek-harness/proxy.mjs
      - ./overrides/proxy.mjs:/opt/seek-harness/proxy.mjs:ro
      # FIX 2026-09-01: re-export settingsNamespace (made internal upstream in
      # 0.1.2-alpha.3) so ecosystem plugins that still import it keep loading.
      # Remove once the plugins ship alpha3-compatible releases.
      - ./overrides/settings-index.js:/opt/dsh-src/packages/settings/settings/lib/index.js:ro
    # Writable temp space. NOT for a browser (there is none) — this exists
    # because of `read_only: true` below: Node, npm/pnpm caches, python,
    # uv/uvx temp venvs (MCP servers) and gcc all need /tmp, and `exec`
    # lets them execute files placed there. size=1g caps RAM usage.
    tmpfs:
      - /tmp:exec,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: false # tini runs INSIDE the image (PID 1, orphan reaping)

volumes:
  dsh-home:
